kind = "web"
previewPath = "/"
title = "Basil Reyno — Personal Brand"
version = "1.0.0"
id = "artifacts/basil-reyno"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19556

[services.development]
run = "pnpm --filter @workspace/basil-reyno run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/basil-reyno", "run", "build" ]
publicDir = "artifacts/basil-reyno/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19556"
BASE_PATH = "/"
